name: Bug report
description: Report a reproducible non-security bug using sanitized data.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Sanitized reproduction and observed behavior
      description: Remove account IDs, plan IDs, store IDs, URLs, cookies, tokens, logs, and business data.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no secrets, production identifiers, HAR files, screenshots, or business data.
          required: true
        - label: This is not a security vulnerability; security issues belong in Private Vulnerability Reporting.
          required: true
